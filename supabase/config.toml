project_id = "Filey"
[api]
enabled = true
port = 56321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 56322
shadow_port = 56320
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = false
[studio]
enabled = true
port = 56323
api_url = "http://127.0.0.1"
[local_smtp]
enabled = true
port = 56324
[storage]
enabled = true
file_size_limit = "20MB"
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
# Enable the email provider; global auth.enable_signup=false still blocks registration.
enable_signup = true
enable_confirmations = false
[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8183
[analytics]
enabled = false
[functions.api]
verify_jwt = false
[functions.cleanup-uploads]
verify_jwt = false
